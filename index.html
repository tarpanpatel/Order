<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orders Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        :root {
            --primary: #00b0ff;
            --primary-bg: #e1f5fe;
            --danger: #ff5252;
            --success: #2ec4b6;
            --warning: #ff9f1c;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 150px; }
        
        header {
            background: #ffffff;
            padding: 8px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 101;
            border-bottom: 1px solid #e2e8f0;
            min-height: 56px;
        }
        .controls { display: flex; width: 100%; max-width: 600px; justify-content: space-between; gap: 6px; }
        .btn { flex: 1; padding: 10px 4px; border: none; border-radius: 10px; color: white; cursor: pointer; font-weight: 700; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; transition: all 0.2s; }
        .btn-start { background: var(--success); }
        .btn-end { background: var(--danger); }
        .btn-bill { background: var(--warning); color: #fff; }
        .btn-log { background: #4a5568; }
        .btn:disabled { background: #cbd5e0 !important; color: #a0aec0 !important; opacity: 0.6; cursor: not-allowed !important; }
        
        .nav-bar { background: #ffffff; padding: 10px 12px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #e2e8f0; position: sticky; top: 56px; z-index: 100; }
        .nav-link { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 13px; padding: 6px 12px; background: var(--bg); border-radius: 20px; border: 1px solid #e2e8f0; }
        .nav-link.active { color: #ffffff; background: var(--primary); border-color: var(--primary); }
        
        .app-body { padding: 12px; max-width: 1600px; margin: 0 auto; }
        .category-section { margin-bottom: 20px; scroll-margin-top: 130px; } 
        .category-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--text-main); display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .category-title::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid #e2e8f0; padding: 12px; text-align: center; position: relative; }
        .card img { width: 44px; height: 44px; object-fit: cover; border-radius: 50%; margin-bottom: 6px; background: #f7fafc; padding: 3px; }
        .card-name { font-size: 13px; font-weight: 600; height: 36px; overflow: hidden; margin-bottom: 4px; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-price { color: var(--primary); font-size: 12px; font-weight: 700; margin-bottom: 8px; }
        .qty-controls { display: flex; justify-content: center; align-items: center; gap: 10px; }
        .qty-btn { width: 28px; height: 28px; background: var(--bg); border: 1px solid #e2e8f0; border-radius: 50%; font-size: 14px; font-weight: 600; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-val { font-size: 13px; font-weight: 700; min-width: 14px; text-align: center; }

        @media (max-width: 600px) {
            .grid { display: flex; flex-direction: column; gap: 5px; }
            .card { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; text-align: left; }
            .card img { width: 28px; height: 28px; margin-bottom: 0; border-radius: 4px; }
            .card-left-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
            .card-details { display: flex; flex-direction: column; min-width: 0; }
            .card-name { font-size: 12px; height: auto; margin-bottom: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
            .card-price { font-size: 11px; margin-top: 1px; margin-bottom: 0; }
        }
        
        .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 8px 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); border-top: 1px solid #e2e8f0; z-index: 101; display: flex; flex-direction: column; gap: 4px; }
        .footer-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .cart-preview { font-size: 11px; color: var(--text-muted); max-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; margin-bottom: 2px; font-weight: 500; }
        .summary-info { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .summary-info span { color: var(--primary); font-size: 15px; font-weight: 700; }
        .btn-submit { background: var(--primary); padding: 8px 20px; font-size: 12px; color: white; border: none; font-weight: 700; border-radius: 16px; cursor: pointer; width: auto; max-width: 140px; text-align: center; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1020; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 95%; max-width: 500px; max-height: 80vh; border-radius: var(--radius); padding: 20px; overflow-y: auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .close-modal { position: absolute; top: 12px; right: 16px; font-size: 22px; cursor: pointer; color: var(--text-muted); }
        
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; margin-bottom: 4px; border-radius: 6px; background: var(--bg); font-size: 12px; }
        .log-item.deleted { color: #a0aec0; text-decoration: line-through; background: #edf2f7; }
        .btn-del { color: var(--danger); font-size: 16px; background: none; border: none; cursor: pointer; padding: 2px 6px; }
        
        .bill-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
        .bill-table th { text-align: left; padding: 6px; background: var(--bg); color: var(--text-muted); font-weight: 700; border-bottom: 2px solid #e2e8f0; }
        .bill-table td { padding: 8px 6px; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
        .bill-total-row { font-size: 14px; font-weight: 800; color: var(--text-main); background: var(--primary-bg); }
        .bill-mod-btn { width: 22px; height: 22px; font-size: 12px; font-weight: 700; border-radius: 4px; border: 1px solid #e2e8f0; background: white; cursor: pointer; margin: 0 2px; display: inline-flex; align-items: center; justify-content: center; }
        .bill-mod-btn:hover { background: var(--primary-bg); color: var(--primary); }

        .prompt-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .prompt-box { background: white; padding: 20px; border-radius: var(--radius); width: 85%; max-width: 340px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); animation: promptPop 0.2s ease-out; }
        @keyframes promptPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .prompt-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; }
        .prompt-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
        .prompt-actions { display: flex; gap: 8px; justify-content: center; }
        .prompt-btn { padding: 8px 20px; font-size: 12px; font-weight: 700; border-radius: 16px; border: none; cursor: pointer; min-width: 80px; }
        .p-btn-confirm { background: var(--primary); color: white; }
        .p-btn-cancel { background: #edf2f7; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="controls">
            <button class="btn btn-start" id="startBtn" onclick="triggerCustomPrompt('START')">▶ Start Billing</button>
            <button class="btn btn-end" id="endBtn" onclick="triggerCustomPrompt('END')" disabled>■ End Billing</button>
            <button class="btn btn-bill" id="billBtn" onclick="openBillModal()">🧾 Bill</button>
            <button class="btn btn-log" onclick="openLogModal()">View Log</button>
        </div>
    </header>

    <div class="nav-bar" id="categoryNav"></div>
    <div class="app-body"><div class="menu-container" id="menuContainer">Loading menu...</div></div>

    <div class="footer-bar">
        <div class="cart-preview" id="cartPreviewList">Basket is empty</div>
        <div class="footer-row">
            <div class="summary-info">Total: <span id="basketTotal">₹0</span></div>
            <button class="btn btn-submit" id="submitBtn" onclick="submitOrder()">Add Order</button>
        </div>
    </div>

    <div class="prompt-modal" id="customPromptModal">
        <div class="prompt-box">
            <div class="prompt-title" id="pTitle">Confirmation</div>
            <div class="prompt-desc" id="pDesc">Are you sure?</div>
            <div class="prompt-actions">
                <button class="prompt-btn p-btn-cancel" onclick="resolveCustomPrompt(false)">Cancel</button>
                <button class="prompt-btn p-btn-confirm" onclick="resolveCustomPrompt(true)">OK</button>
            </div>
        </div>
    </div>

    <div class="modal" id="logModal"><div class="modal-content"><span class="close-modal" onclick="closeModal('logModal')">&times;</span><h3 style="margin-bottom:15px; font-weight:700; font-size:14px;">Orders Logged</h3><div id="logContainer"></div></div></div>
    <div class="modal" id="billModal"><div class="modal-content"><span class="close-modal" onclick="closeModal('billModal')">&times;</span><h3 style="font-weight:800; font-size:14px;">Current Guest Itemised Bill</h3><p style="font-size:11px; color:var(--text-muted); margin-bottom:12px;" id="billSessionMeta"></p><div id="billContainer"></div></div></div>

    <script>
        let globalSyncLocalDateStr = new Date().toISOString().split('T')[0]; 
        let menuData = []; 
        const orderQuantities = {};
        let pType = null, pRow = null;

        function loadDynamicMenu() {
            fetch('save.php?action=get_menu')
                .then(r => r.json())
                .then(data => {
                    menuData = data;
                    renderMenu();
                });
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const navBar = document.getElementById('categoryNav');
            const categories = [...new Set(menuData.map(item => item.category))];
            container.innerHTML = ""; navBar.innerHTML = "";
            
            categories.forEach(cat => {
                const safeId = cat.replace(/\s+/g, '-').toLowerCase();
                navBar.innerHTML += `<a href="#${safeId}" class="nav-link" onclick="setActiveLink(this)">${cat}</a>`;
                let section = document.createElement('div');
                section.className = 'category-section'; section.id = safeId;
                section.innerHTML = `<h3 class="category-title">${cat}</h3>`;
                let grid = document.createElement('div'); grid.className = 'grid';
                
                menuData.filter(item => item.category === cat).forEach(item => {
                    orderQuantities[item.id] = 0;
                    grid.innerHTML += `
                        <div class="card">
                            <div class="card-left-group">
                                <img src="https://img.icons8.com/fluent/48/000000/hamburger.png">
                                <div class="card-details"><span class="card-name">${item.name}</span><span class="card-price">₹${item.price}</span></div>
                            </div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                                <span class="qty-val" id="qty-${item.id}">0</span>
                                <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                            </div>
                        </div>`;
                });
                section.appendChild(grid); container.appendChild(section);
            });
        }

        function setActiveLink(e) { document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active')); e.classList.add('active'); }
        function updateQty(id, c) { let n = (orderQuantities[id] || 0) + c; if(n >= 0){ orderQuantities[id] = n; document.getElementById(`qty-${id}`).innerText = n; calculateRunningTotal(); } }

        function calculateRunningTotal() {
            let sum = 0, desc = [];
            menuData.forEach(item => {
                let qty = orderQuantities[item.id] || 0;
                if (qty > 0) { sum += qty * item.price; desc.push(`${item.name} (x${qty})`); }
            });
            document.getElementById('basketTotal').innerText = `₹${sum}`;
            document.getElementById('cartPreviewList').innerText = desc.length ? desc.join(", ") : "Basket is empty";
        }

        function triggerCustomPrompt(type, rowId = null) {
            pType = type; pRow = rowId;
            document.getElementById('pTitle').innerText = type === "START" ? "Check-In" : (type === "END" ? "Check-Out" : "Cancel Item");
            document.getElementById('pDesc').innerText = type === "START" ? "Start billing for a new guest?" : (type === "END" ? "End billing for this guest?" : "Remove this item from logs?");
            document.getElementById('customPromptModal').style.display = "flex";
        }

        function resolveCustomPrompt(confirmed) {
            document.getElementById('customPromptModal').style.display = "none";
            if (!confirmed) return;
            if (pType === "START" || pType === "END") {
                fetch(`save.php?action=save_order`, {
                    method: 'POST',
                    body: JSON.stringify({ status: pType === "START" ? "SESSION_START" : "SESSION_END", items: [{ name: pType + " MARKER", category: "SYSTEM_SESSION", quantity: 1, price: 0, total: 0 }] })
                }).then(r => r.json()).then(res => {
                    alert(pType === "START" ? "Check-in logged." : "Checkout logged.");
                    document.getElementById('startBtn').disabled = (pType === "START");
                    document.getElementById('endBtn').disabled = (pType === "END");
                });
            } else if (pType === "DELETE_ITEM") {
                fetch(`save.php?action=delete_row&row_id=${pRow}`).then(r => r.json()).then(() => openLogModal());
            }
        }

        function submitOrder() {
            let items = [];
            menuData.forEach(item => {
                if ((orderQuantities[item.id] || 0) > 0) items.push({ name: item.name, category: item.category, quantity: orderQuantities[item.id], price: item.price, total: orderQuantities[item.id] * item.price });
            });
            if (!items.length) { alert("Add items first."); return; }
            document.getElementById('submitBtn').innerText = "Adding...";
            fetch('save.php?action=save_order', { method: 'POST', body: JSON.stringify({ items: items }) })
                .then(r => r.json()).then(res => {
                    alert("Added to billing");
                    globalSyncLocalDateStr = res.currentLocalDate;
                    menuData.forEach(item => { orderQuantities[item.id] = 0; document.getElementById(`qty-${item.id}`).innerText = 0; });
                    calculateRunningTotal();
                })
                .catch(() => alert("Connection timeout. Please try again."))
                .finally(() => {
                    document.getElementById('submitBtn').innerText = "Add Order";
                });
        }

        function openLogModal() {
            document.getElementById('logModal').style.display = 'flex';
            const container = document.getElementById('logContainer');
            container.innerHTML = "Fetching today's logs...";

            fetch(`save.php?action=get_day_log&date=${globalSyncLocalDateStr}`)
                .then(r => r.json())
                .then(data => {
                    if (!data || !Array.isArray(data) || data.length === 0) {
                        container.innerHTML = "<p style='color:var(--text-muted); padding:10px 0;'>No orders found for today.</p>";
                        return;
                    }
                    container.innerHTML = "";
                    data.forEach(row => {
                        if (row.category === "SYSTEM_SESSION") return; 
                        const isDel = row.status === 'DELETED';
                        
                        container.innerHTML += `
                            <div class="log-item ${isDel ? 'deleted' : ''}">
                                <div>
                                    <span style="color:var(--primary); font-weight:700; margin-right:6px;">[${row.timestamp.substring(0,5)}]</span> 
                                    <strong>${row.name}</strong> <span style="color:var(--text-muted)">x${row.quantity}</span> — ₹${row.total}
                                </div>
                                ${!isDel ? `<button class="btn-del" onclick="triggerCustomPrompt('DELETE_ITEM', ${row.rowId})">&times;</button>` : '<span style="font-size:11px; font-weight:700; color:var(--text-muted);">[VOID]</span>'}
                            </div>`;
                    });
                });
        }

        function openBillModal() {
            document.getElementById('billModal').style.display = 'flex';
            document.getElementById('billSessionMeta').innerText = "Summary generated at " + new Date().toLocaleTimeString();
            fetch('save.php?action=get_active_session').then(r => r.json()).then(rows => {
                let active = rows.filter(r => r.category !== 'SYSTEM_SESSION' && r.status !== 'DELETED');
                let c = document.getElementById('billContainer'); if(!active.length) { c.innerHTML = "No active items."; return; }
                let bill = {}, total = 0;
                active.forEach(item => {
                    if(bill[item.name]) { bill[item.name].quantity += Number(item.quantity); bill[item.name].total += Number(item.total); }
                    else { bill[item.name] = { name: item.name, quantity: Number(item.quantity), price: Number(item.price), total: Number(item.total), rowId: item.rowId }; }
                    total += Number(item.total);
                });
                let html = `<table class="bill-table"><thead><tr><th>Details</th><th style="text-align:center;">Qty</th><th>Rate</th><th>Amt</th></tr></thead><tbody>`;
                for(let k in bill) {
                    html += `<tr><td><strong>${bill[k].name}</strong></td><td style="text-align:center;"><button class="bill-mod-btn" onclick="adjItem(${bill[k].rowId},-1)">-</button> <b>${bill[k].quantity}</b> <button class="bill-mod-btn" onclick="adjItem(${bill[k].rowId},1)">+</button></td><td>₹${bill[k].price}</td><td>₹${bill[k].total}</td></tr>`;
                }
                html += `<tr class="bill-total-row"><td colspan="3" style="text-align:right; padding:10px;">Total:</td><td>₹${total}</td></tr></tbody></table>`;
                c.innerHTML = html;
            });
        }

        function adjItem(id, v) { fetch(`save.php?action=modify_qty&row_id=${id}&change=${v}`).then(r => r.json()).then(() => openBillModal()); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        loadDynamicMenu();
    </script>
</body>
</html>
